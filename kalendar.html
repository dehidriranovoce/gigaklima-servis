<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalendar · GIGA klima servis</title>
<meta name="theme-color" content="#0048BC">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIGA servis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
html,body{margin:0;height:100%;background:#DCE6EE;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit}
a,button{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/template" id="tpl">

<div style="position:relative;width:100%;max-width:520px;height:100dvh;margin:0 auto;box-sizing:border-box;background:#F2F7FA;color:#0B2540;display:flex;flex-direction:column;overflow:hidden;font-family:Inter,system-ui,sans-serif">
  <div style="padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="width:32px;height:4px;border-radius:2px;background:#F26A12;margin-bottom:8px"></div>
      <div style="font-size:24px;font-weight:700">Kalendar</div>
      <div style="font-size:14px;color:#41566B;margin-top:2px">Novembar 2026</div>
    </div>
    <div style="display:flex;gap:8px">
      <button aria-label="Prethodna nedelja" onClick="{{ prev }}" style="width:48px;height:48px;border-radius:24px;border:1px solid #CBD9E3;background:#fff;color:#0B2540;display:flex;align-items:center;justify-content:center;opacity:{{ arrowOpacity }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button aria-label="Sledeća nedelja" onClick="{{ next }}" style="width:48px;height:48px;border-radius:24px;border:1px solid #CBD9E3;background:#fff;color:#0B2540;display:flex;align-items:center;justify-content:center;opacity:{{ arrowOpacity }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
  <div style="padding:4px 20px 8px">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#E3ECF2;border-radius:14px;padding:4px">
      <sc-for list="{{ views }}" as="v" hint-placeholder-count="2">
        <button aria-pressed="{{ v.pressed }}" onClick="{{ v.pick }}" style="{{ v.style }}">{{ v.label }}</button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ isWeek }}" hint-placeholder-val="{{ true }}">
    <div style="padding:4px 20px 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <button aria-pressed="{{ d.pressed }}" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="{{ d.style }}">
          <span style="display:block;font-size:11px;font-weight:600">{{ d.wd }}</span>
          <span style="display:block;font-size:17px;font-weight:700;margin-top:2px">{{ d.n }}</span>
          <span style="display:block;font-size:14px;line-height:10px;height:10px;margin-top:2px">{{ d.dots }}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isMonth }}" hint-placeholder-val="{{ false }}">
    <div style="padding:4px 20px 0">
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px">
        <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
          <div style="text-align:center;font-size:11px;font-weight:600;color:#41566B">{{ w }}</div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
          <button aria-pressed="{{ c.pressed }}" aria-label="{{ c.aria }}" onClick="{{ c.pick }}" style="{{ c.style }}">
            <span style="display:block;font-size:15px;font-weight:700">{{ c.n }}</span>
            <span style="display:block;font-size:12px;line-height:8px;height:8px;margin-top:1px">{{ c.dots }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <div style="padding:10px 20px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:#41566B">
    <span style="width:14px;height:14px;border-radius:4px;background:#FBD5B5;border:1.5px solid #F26A12;box-sizing:border-box;display:inline-block"></span>Popunjen dan: nema slobodnog sata do 18:00
  </div>
  <div style="padding:14px 20px 8px">
    <div style="font-size:15px;font-weight:600">{{ dayTitle }}</div>
    <div style="font-size:13px;color:#41566B;margin-top:2px">{{ free }}</div>
  </div>
  <div style="padding:0 20px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto">
    <sc-for list="{{ events }}" as="e" hint-placeholder-count="3">
      <div style="display:flex;gap:12px;align-items:stretch">
        <div style="width:56px;flex:none;padding-top:12px"><div style="font-size:14px;font-weight:700">{{ e.t }}</div><div style="font-size:12px;color:#41566B;margin-top:2px">{{ e.end }}</div></div>
        <div style="flex:1;min-width:0;background:#fff;border:1px solid #D9E5ED;border-radius:14px;padding:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div style="font-size:15px;font-weight:700">{{ e.n }}</div>
            <div style="{{ e.chip }}">{{ e.k }}</div>
          </div>
          <div style="font-size:13px;color:#41566B;margin-top:4px">{{ e.s }}</div>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;color:#41566B;font-size:14px;padding:24px 0">Nema termina za ovaj dan</div>
    </sc-if>
  </div>
  <a href="termin.html" aria-label="Novi termin" style="position:absolute;right:20px;bottom:88px;height:52px;padding:0 20px;border-radius:26px;background:#0048BC;color:#fff;display:flex;align-items:center;gap:8px;text-decoration:none;font:700 15px Inter,system-ui,sans-serif;box-shadow:0 4px 12px rgba(11,37,64,0.25)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novi termin</a>
  <div style="height:72px;box-sizing:border-box;background:#fff;border-top:1px solid #D9E5ED;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
    <a href="index.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#41566B;text-decoration:none;font-size:12px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Danas</a>
    <a href="kalendar.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#0048BC;text-decoration:none;font-size:12px;font-weight:600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Kalendar</a>
    <a href="klijent.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#41566B;text-decoration:none;font-size:12px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Klijenti</a>
    <a href="podsetnici.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#41566B;text-decoration:none;font-size:12px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Podsetnici</a>
  </div>
</div>
</script>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: 21, view: 'week' };
}
renderVals() {
const sel = this.state.day;
const view = this.state.view;
const DAY_START = 8 * 60;
const DAY_END = 18 * 60;
const NEED = 60;
const explicit = {
16: [{ s: '10:00', d: 60, n: 'Ana Jovanović', a: 'Zemun, Prvomajska 3', k: 'Servis' }],
17: [{ s: '08:30', d: 120, n: 'Dragan Simić', a: 'Zemun, Ugrinovačka 20', k: 'Kvar' }, { s: '10:30', d: 300, n: 'Nikolić d.o.o.', a: 'Servis 8 uređaja · Novi Beograd, Jurija Gagarina 14', k: 'Servis' }, { s: '16:00', d: 90, n: 'Vesna Đorđević', a: 'Zemun, Pregrevica 9', k: 'Servis' }],
18: [{ s: '12:00', d: 180, n: 'Petar Ristić', a: 'Batajnica, Cara Dušana 40', k: 'Ugradnja' }],
19: [{ s: '08:30', d: 150, n: 'Milica Savić', a: 'Zemun, Gornji grad 5', k: 'Servis' }, { s: '11:00', d: 240, n: 'Goran Lukić', a: 'Prodaja + montaža · Zemun, Dubrovačka 18', k: 'Ugradnja' }, { s: '15:30', d: 120, n: 'Ivana Marić', a: 'Novi Beograd, Omladinskih brigada 7', k: 'Kvar' }],
20: [{ s: '10:00', d: 60, n: 'Zoran Pavlović', a: 'Zemun, Sutjeska 2', k: 'Servis' }, { s: '14:00', d: 60, n: 'Tamara Ilić', a: 'Zemun, Ugrinovačka 62', k: 'Servis' }],
21: [{ s: '09:00', d: 75, n: 'Marko Petrović', a: 'Zemun, Glavna 12', k: 'Servis' }, { s: '11:30', d: 180, n: 'Jelena Ilić', a: 'Novi Beograd, Bulevar 45/8', k: 'Ugradnja' }, { s: '15:00', d: 90, n: 'Stan Nikolić', a: 'Zemun, Cara Dušana 7', k: 'Kvar' }],
22: []
};
const pool = [['Ana Jovanović', 'Zemun, Prvomajska 3'], ['Dragan Simić', 'Zemun, Ugrinovačka 20'], ['Milica Savić', 'Zemun, Gornji grad 5'], ['Goran Lukić', 'Zemun, Dubrovačka 18'], ['Ivana Marić', 'Novi Beograd, Omladinskih brigada 7'], ['Zoran Pavlović', 'Zemun, Sutjeska 2'], ['Tamara Ilić', 'Zemun, Ugrinovačka 62'], ['Petar Ristić', 'Batajnica, Cara Dušana 40'], ['Vesna Đorđević', 'Zemun, Pregrevica 9'], ['Nenad Kostić', 'Zemun, Glavna 30']];
const kinds = ['Servis', 'Kvar', 'Ugradnja'];
const templates = [
[],
[{ s: '10:00', d: 90 }],
[{ s: '09:00', d: 120 }, { s: '13:00', d: 60 }],
[{ s: '09:30', d: 90 }, { s: '12:00', d: 120 }],
[{ s: '08:30', d: 150 }, { s: '11:00', d: 240 }, { s: '15:30', d: 120 }]
];
const idx = (d) => (d - 1 + 6) % 7;
const dataFor = (d) => {
if (explicit[d]) { return explicit[d]; }
if (idx(d) === 6) { return []; }
const load = (d * 5 + 3) % 5;
return templates[load].map((t, i) => ({ s: t.s, d: t.d, n: pool[(d + i) % 10][0], a: pool[(d + i) % 10][1], k: kinds[(d + i) % 3] }));
};
const toMin = (t) => parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3), 10);
const pad = (x) => (x < 10 ? '0' + x : '' + x);
const fmt = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const dur = (m) => (m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min');
const gapOf = (list) => {
const sorted = list.slice().sort((x, y) => toMin(x.s) - toMin(y.s));
let cursor = DAY_START;
let best = 0;
sorted.forEach((e) => {
const st = toMin(e.s);
best = Math.max(best, st - cursor);
cursor = Math.max(cursor, st + e.d);
});
best = Math.max(best, DAY_END - cursor);
return Math.max(best, 0);
};
const isFull = (d) => { const l = dataFor(d); return l.length > 0 && gapOf(l) < NEED; };
const chips = {
Servis: 'color:#0048BC;background:#E4F3FF',
Kvar: 'color:#8A4B08;background:#FDF0DC',
Ugradnja: 'color:#1B6B3A;background:#E3F4EA'
};
const names = ['Ponedeljak', 'Utorak', 'Sreda', 'Četvrtak', 'Petak', 'Subota', 'Nedelja'];
const wd = ['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub', 'Ned'];
const dayStyle = (d, on, base) => {
const full = isFull(d);
let st;
if (full) {
st = on ? 'border:3px solid #0B2540;background:#FBD5B5;color:#55606B' : 'border:1.5px solid #F26A12;background:#FBD5B5;color:#55606B';
} else if (on) {
st = 'border:2px solid #0048BC;background:#0048BC;color:#fff';
} else if (d === 21) {
st = 'border:2px solid #0048BC;background:#fff;color:#0B2540';
} else {
st = 'border:1px solid #D9E5ED;background:#fff;color:#0B2540';
}
return base + st;
};
const weekStart = sel - idx(sel);
const days = [0, 1, 2, 3, 4, 5, 6].map((k) => {
const n = weekStart + k;
const valid = n >= 1 && n <= 30;
const on = n === sel;
const cnt = valid ? dataFor(n).length : 0;
return {
n: valid ? String(n) : '',
wd: wd[k],
aria: valid ? names[k] + ', ' + n + '. novembar, termina: ' + cnt + (isFull(n) ? ', dan je popunjen' : '') : 'Van meseca',
pressed: on,
dots: '•'.repeat(Math.min(cnt, 3)),
pick: () => { if (valid) { this.setState({ day: n }); } },
style: valid ? dayStyle(n, on, 'box-sizing:border-box;min-height:68px;border-radius:12px;font-family:Inter,system-ui,sans-serif;padding:6px 0;') : 'visibility:hidden;min-height:68px'
};
});
const cells = [];
for (let b = 0; b < 6; b++) {
cells.push({ n: '', dots: '', aria: '', pressed: false, pick: () => {}, style: 'visibility:hidden;min-height:48px' });
}
for (let n = 1; n <= 30; n++) {
const cnt = dataFor(n).length;
const on = n === sel;
cells.push({
n: String(n),
dots: '•'.repeat(Math.min(cnt, 3)),
aria: names[idx(n)] + ', ' + n + '. novembar, termina: ' + cnt + (isFull(n) ? ', dan je popunjen' : ''),
pressed: on,
pick: () => this.setState({ day: n }),
style: dayStyle(n, on, 'box-sizing:border-box;min-height:48px;border-radius:10px;font-family:Inter,system-ui,sans-serif;padding:4px 0;')
});
}
const viewDefs = [{ id: 'week', label: 'Nedelja' }, { id: 'month', label: 'Mesec' }];
const views = viewDefs.map((v) => {
const on = v.id === view;
return {
label: v.label,
pressed: on,
pick: () => this.setState({ view: v.id }),
style: 'height:40px;border-radius:10px;border:0;font:600 14px Inter,system-ui,sans-serif;' + (on ? 'background:#fff;color:#0048BC;box-shadow:0 1px 3px rgba(11,37,64,0.15)' : 'background:transparent;color:#41566B')
};
});
const list = dataFor(sel).slice().sort((x, y) => toMin(x.s) - toMin(y.s));
const events = list.map((e) => ({ t: e.s, end: 'do ' + fmt(toMin(e.s) + e.d), n: e.n, s: e.a, k: e.k, chip: 'font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap;' + chips[e.k] }));
const c = list.length;
const gap = gapOf(list);
let free;
if (c === 0) {
free = 'Ceo dan je slobodan';
} else if (gap < NEED) {
free = 'Nema slobodnog sata do 18:00';
} else {
free = 'Najduži slobodan razmak: ' + dur(gap);
}
const shift = (delta) => () => {
if (view === 'week') {
const nd = sel + delta * 7;
this.setState({ day: Math.min(30, Math.max(1, nd)) });
}
};
return {
views,
isWeek: view === 'week',
isMonth: view === 'month',
days,
cells,
weekdays: wd,
events,
free,
prev: shift(-1),
next: shift(1),
arrowOpacity: view === 'week' ? '1' : '0.4',
empty: c === 0,
dayTitle: names[idx(sel)] + ', ' + sel + '. novembar · ' + (c === 0 ? 'nema termina' : (c === 1 ? '1 termin' : c + ' termina'))
};
}
}
DCMount(Component, 'tpl', 'app');
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
